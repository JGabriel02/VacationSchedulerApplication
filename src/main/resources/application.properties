spring.application.name=vacation-scheduler

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

server.port=${SERVER_PORT:8080}
# Usa o X-Forwarded-For apenas de proxies internos (ex.: o do Render) para obter o IP real do cliente.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}

app.login-rate-limit.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
app.login-rate-limit.ip-window=${LOGIN_IP_WINDOW:1m}
app.login-rate-limit.max-failures-per-email=${LOGIN_MAX_FAILURES_PER_EMAIL:5}
app.login-rate-limit.email-window=${LOGIN_EMAIL_WINDOW:15m}

app.vacation-archive.rejected-after-days=${VACATION_ARCHIVE_REJECTED_DAYS:90}
app.vacation-archive.completed-after-days=${VACATION_ARCHIVE_COMPLETED_DAYS:365}
app.vacation-archive.cron=${VACATION_ARCHIVE_CRON:0 0 2 * * *}
app.vacation-archive.zone=${VACATION_ARCHIVE_ZONE:${APP_TIME_ZONE:America/Sao_Paulo}}