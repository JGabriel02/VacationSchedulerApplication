spring.application.name=vacation-scheduler

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

server.port=${SERVER_PORT:8080}

app.vacation-archive.rejected-after-days=${VACATION_ARCHIVE_REJECTED_DAYS:90}
app.vacation-archive.completed-after-days=${VACATION_ARCHIVE_COMPLETED_DAYS:365}
app.vacation-archive.cron=${VACATION_ARCHIVE_CRON:0 0 2 * * *}
app.vacation-archive.zone=${VACATION_ARCHIVE_ZONE:America/Sao_Paulo}